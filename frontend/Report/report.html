<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Reports</title>
    <link rel="stylesheet" href="report.css" />
  </head>
  <body>
    <div class="container">
      <h1>Expense Reports</h1>

      <div class="filters">
        <button class="filter-btn active" data-period="daily">Daily</button>
        <button class="filter-btn" data-period="weekly">Weekly</button>
        <button class="filter-btn" data-period="monthly">Monthly</button>
      </div>

      <div class="summary">
        <div class="summary-box">
          <h3>Total Income</h3>
          <p id="totalIncome">₹0</p>
        </div>

        <div class="summary-box">
          <h3>Total Expense</h3>
          <p id="totalExpense">₹0</p>
        </div>

        <div class="summary-box">
          <h3>Savings</h3>
          <p id="savings">₹0</p>
        </div>
      </div>

      <h2>Expense Details</h2>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Income</th>
            <th>Expense</th>
          </tr>
        </thead>

        <tbody id="reportTable"></tbody>
      </table>

      <button id="downloadBtn">⬇ Download Report</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="report.js"></script>
  </body>
</html>
