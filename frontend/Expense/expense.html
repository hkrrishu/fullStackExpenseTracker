<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Expense</title>
  </head>
  <body>
    <h2 id="premiumMessage" style="display: none">
      You are a premium user now
    </h2>
    <div id="leaderboardSection" style="display: none">
      <h2>Expense Leaderboard 🏆</h2>

      <button id="showLeaderboardBtn">Show Leaderboard</button>

      <ul id="leaderboardList"></ul>
    </div>
    <h1>Daily Expense Tracker</h1>

    <form id="expenseForm">
      <label for="expenseamount">Amount Spent:</label>
      <input type="number" id="expenseamount" name="expenseamount" required />
      <br /><br />

      <label for="description">Description:</label>
      <input type="text" id="description" name="description" required />
      <br /><br />

      <button type="submit">Add Expense</button>
    </form>

    <button id="buyPremiumBtn">Buy Premium Membership - ₹499</button>

    <h2>My Expenses</h2>
   <ul id="expenseList"></ul>

<div>
  <label for="itemsPerPage">Rows per page:</label>

  <select id="itemsPerPage">
    <option value="10">10</option>
    <option value="25">25</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>
</div>

<div id="pagination"></div>

    <br /><br />

    <button id="reportBtn">📊 View Expense Reports</button>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="expense.js"></script>
  </body>
</html>
